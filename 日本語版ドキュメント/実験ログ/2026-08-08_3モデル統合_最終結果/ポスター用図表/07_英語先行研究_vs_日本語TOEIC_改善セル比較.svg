<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720"><style>
text{font-family:"Noto Sans CJK JP","Yu Gothic",Meiryo,sans-serif;fill:#20252b}
.title{font-size:38px;font-weight:700}.sub{font-size:22px}.axis{font-size:19px}.big{font-size:42px;font-weight:700}.count{font-size:25px;font-weight:700;fill:#ffffff}.label{font-size:24px;font-weight:700}.note{font-size:19px}
</style><rect width="1400" height="720" fill="#ffffff"/><text x="700.0" y="55" text-anchor="middle" class="title">自動改善で順位が良くなった組み合わせ</text><text x="700.0" y="92" text-anchor="middle" class="sub">同じ数え方で比較：1セル ＝ 1種類の指示 × 1つの順位評価モデル</text><line x1="145" x2="1330" y1="600.0" y2="600.0" stroke="#9aa1a8" stroke-width="1.5"/><text x="127" y="607.0" text-anchor="end" class="axis">0%</text><line x1="145" x2="1330" y1="511.0" y2="511.0" stroke="#d9dde1" stroke-width="1"/><text x="127" y="518.0" text-anchor="end" class="axis">20%</text><line x1="145" x2="1330" y1="422.0" y2="422.0" stroke="#d9dde1" stroke-width="1"/><text x="127" y="429.0" text-anchor="end" class="axis">40%</text><line x1="145" x2="1330" y1="333.0" y2="333.0" stroke="#d9dde1" stroke-width="1"/><text x="127" y="340.0" text-anchor="end" class="axis">60%</text><line x1="145" x2="1330" y1="244.0" y2="244.0" stroke="#d9dde1" stroke-width="1"/><text x="127" y="251.0" text-anchor="end" class="axis">80%</text><line x1="145" x2="1330" y1="155.0" y2="155.0" stroke="#d9dde1" stroke-width="1"/><text x="127" y="162.0" text-anchor="end" class="axis">100%</text><rect x="280.0" y="226.2" width="300" height="373.8" rx="12" fill="#65A844"/><text x="430" y="204.2" text-anchor="middle" class="big">84.0%</text><text x="430" y="278.2" text-anchor="middle" class="count">63 / 75</text><text x="430" y="648.0" text-anchor="middle" class="label">先行研究 E-GEO（英語）</text><rect x="820.0" y="253.8" width="300" height="346.2" rx="12" fill="#2F7A69"/><text x="970" y="231.8" text-anchor="middle" class="big">77.8%</text><text x="970" y="305.8" text-anchor="middle" class="count">35 / 45</text><text x="970" y="648.0" text-anchor="middle" class="label">本研究（日本語TOEIC）</text><text x="700.0" y="690" text-anchor="middle" class="note">英語・日本語とも、大半の「指示 × 順位評価モデル」で自動改善後の順位が良くなった。</text></svg>